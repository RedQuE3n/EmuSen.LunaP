# Publish to NuGet.org when a version tag is pushed.
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# THERE IS NO API KEY, and that is deliberate. This uses NuGet Trusted
# Publishing: the job asks GitHub for a short-lived OIDC token proving which
# repository and which workflow file is running, and nuget.org exchanges that
# for an API key valid for a few minutes. Nothing long-lived is stored anywhere,
# so there is no secret to leak, rotate, or accidentally print in a log.
#
# The trust policy lives on nuget.org under Account -> Trusted Publishing, and
# it names four things that must match this file exactly:
#
#     Publisher          GitHub Actions
#     Repository Owner   RedQuE3n          (the GitHub LOGIN, not a person's name)
#     Repository         EmuSen.LunaP
#     Workflow           publish.yml       (renaming this file breaks publishing)
#
# THE VERSION COMES FROM THE TAG, not from the csproj. A version written in two
# places is a version that will eventually disagree with itself, and the failure
# mode is one this project has already been bitten by: NuGet caches by package
# id AND version, so a package published under a version somebody has already
# restored is a package nobody receives. The csproj's <Version> stays as the
# default for a local `dotnet pack`.
name: publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      # The whole mechanism. Without id-token: write the job cannot ask GitHub
      # for the token nuget.org wants to see, and the exchange below fails with
      # nothing more useful than a 401.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Tested before published. A package that was never run is a package whose
      # first user is running it for you.
      - run: dotnet test

      - name: Pack at the tagged version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "packing $VERSION"
          dotnet pack src/EmuSen.LunaP/EmuSen.LunaP.csproj \
            -c Release -o nupkgs -p:Version="$VERSION"

      - name: Exchange the OIDC token for a short-lived key
        uses: NuGet/login@v1
        id: login
        with:
          user: RedQuE3n

      # --skip-duplicate so re-running a failed job is not itself a failure:
      # nuget.org will not accept a version twice, and that is the check working
      # rather than something to work around.
      - name: Push to NuGet.org
        run: |
          dotnet nuget push "nupkgs/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
